name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup.sh

      - name: Validate scripts
        run: |
          ./scripts/test.sh

      - name: Build
        run: ./scripts/build.sh
